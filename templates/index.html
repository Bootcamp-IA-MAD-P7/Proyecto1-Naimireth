<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TAXIGOTECH - Driver Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <aside class="sidebar">
        <div class="logo">TAXIGOTECH</div>
        <div class="nav-links">
            <div class="nav-item"><i class="fas fa-chart-pie"></i> Resumen</div>
            <div class="nav-item active"><i class="fas fa-stopwatch"></i> Taxímetro</div>
            <div class="nav-item"><i class="fas fa-history"></i> Historial</div>
            <div class="nav-item"><i class="fas fa-coins"></i> Tarifas (Ajustes)</div>
            <div class="nav-item"><i class="fas fa-user-cog"></i> Perfil</div>
        </div>
    </aside>

    <main class="main-content">
        <header>
            <h2 style="color: var(--purple-dark);">Terminal de Servicio</h2>
            <div style="background: white; padding: 10px 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
                <span style="font-weight: bold; color: var(--purple-main);">Estado:</span> Disponible
            </div>
        </header>

        <section class="taximetro-core">
            <div class="display-screen">
                <span style="color: var(--purple-main); letter-spacing: 2px; font-size: 0.8rem; font-weight: bold;">TOTAL A COBRAR</span>
                <p class="fare-amount" id="displayFare">00.00€</p>
            </div>

            <div class="controls">
                <button class="btn-tgt btn-start" onclick="contar()"><i class="fas fa-play"></i> Iniciar Viaje</button>
                <button class="btn-tgt btn-pause" onclick="pausar()"><i class="fas fa-pause"></i> Pausa / Semáforo</button>
                <button class="btn-tgt btn-stop" onclick="resetear()"><i class="fas fa-check"></i> Finalizar</button>
            </div>
        </section>

        <section class="history-section">
            <h3 style="margin: 0; color: var(--purple-dark);">Últimos servicios del día</h3>
            <table class="history-table">
                <thead>
                    <tr>
                        <th>ID VIAJE</th>
                        <th>HORA</th>
                        <th>DURACIÓN</th>
                        <th>TOTAL</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>#TGT-882</td>
                        <td>14:30</td>
                        <td>12 min</td>
                        <td style="font-weight: bold; color: var(--purple-main);">14.20€</td>
                    </tr>
                    <tr>
                        <td>#TGT-881</td>
                        <td>13:15</td>
                        <td>8 min</td>
                        <td style="font-weight: bold; color: var(--purple-main);">9.50€</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <script>
        let total = 0;
        let timer = null;

        function contar() {
            if (timer) return;
            timer = setInterval(() => {
                total += 0.05;
                document.getElementById('displayFare').innerText = total.toFixed(2) + "€";
            }, 1000);
        }

        function pausar() {
            clearInterval(timer);
            timer = null;
        }

        function resetear() {
            clearInterval(timer);
            timer = null;
            alert("Cobro realizado: " + total.toFixed(2) + "€");
            total = 0;
            document.getElementById('displayFare').innerText = "00.00€";
        }
    </script>

</body>
</html>
